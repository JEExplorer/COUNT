name: حساب من

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ساخت اپلیکیشن اندروید
    runs-on: ubuntu-latest
    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: آماده‌سازی پروژه اندروید
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org com.afghanbusiness .
          fi

      - name: دریافت وابستگی‌ها
        run: flutter pub get

      - name: ساخت APK
        run: flutter build apk --release

      - name: ذخیره فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-Business-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
